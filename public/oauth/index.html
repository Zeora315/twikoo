<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>评论授权</title>
    <link rel="stylesheet" href="/oauth/style.css" />
  </head>
  <body>
    <main class="oauth-shell">
      <section class="oauth-card" aria-live="polite">
        <header class="brand-lockup" aria-label="当前页面">
          <strong data-page-title>评论授权</strong>
        </header>

        <section id="loadingView" class="state-view">
          <h1>正在检查登录状态</h1>
          <p>请稍候，正在连接评论账号服务。</p>
        </section>

        <section id="loginView" class="state-view hidden">
          <h1>登录到 <span data-site-name>博客</span> 评论系统</h1>
          <p class="lead">使用评论账号登录，昵称、头像和个人主页会同步到评论区。</p>

          <div class="mode-tabs" role="tablist" aria-label="登录方式">
            <button type="button" data-mode-tab="login" class="is-active">登录</button>
            <button type="button" data-mode-tab="register">注册</button>
            <button type="button" data-mode-tab="reset">忘记密码</button>
          </div>

          <div id="captchaStatus" class="security-pill hidden" aria-live="polite">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3 5.5 5.7v5.8c0 4 2.7 7.5 6.5 8.5 3.8-1 6.5-4.5 6.5-8.5V5.7L12 3Z" />
              <path d="m9.4 12.2 1.8 1.8 3.6-4" />
            </svg>
            <span>站点人机验证已启用</span>
          </div>

          <form id="emailForm" class="oauth-form">
            <label>
              <span>邮箱</span>
              <input id="emailInput" name="email" type="email" required autocomplete="email" placeholder="name@example.com" />
            </label>
            <label class="remember-row">
              <input id="rememberMeInput" name="rememberMe" type="checkbox" checked />
              <span>记住我，下次自动登录</span>
            </label>
            <button class="primary-btn" type="submit">下一步</button>
          </form>

          <form id="passwordForm" class="oauth-form hidden">
            <label>
              <span>密码</span>
              <input name="password" type="password" required autocomplete="current-password" />
            </label>
            <div class="form-actions">
              <button class="primary-btn" type="submit">登录</button>
              <button class="quiet-btn" type="button" data-back-email>上一步</button>
            </div>
          </form>

          <form id="registerForm" class="oauth-form hidden">
            <label>
              <span>邮箱验证码</span>
              <input name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" required autocomplete="one-time-code" placeholder="6 位验证码" />
            </label>
            <label>
              <span>用户名</span>
              <input name="username" required minlength="3" maxlength="32" autocomplete="username" placeholder="new_user" />
            </label>
            <label>
              <span>显示名称</span>
              <input name="displayName" maxlength="64" autocomplete="name" placeholder="你的昵称" />
            </label>
            <label>
              <span>密码</span>
              <input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="至少 8 位" />
            </label>
            <div class="form-actions">
              <button class="primary-btn" type="submit">注册并授权</button>
              <button class="quiet-btn" type="button" data-back-email>上一步</button>
            </div>
          </form>

          <form id="resetForm" class="oauth-form hidden">
            <label>
              <span>邮箱验证码</span>
              <input name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" required autocomplete="one-time-code" placeholder="6 位验证码" />
            </label>
            <label>
              <span>新密码</span>
              <input name="newPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="至少 8 位" />
            </label>
            <div class="form-actions">
              <button class="primary-btn" type="submit">重置并登录</button>
              <button class="quiet-btn" type="button" data-back-email>上一步</button>
            </div>
          </form>
        </section>

        <section id="consentView" class="state-view hidden">
          <h1>你即将登录到 <span data-site-name>博客</span> 评论系统</h1>

          <div class="user-row">
            <span id="userAvatar" class="avatar" aria-hidden="true">Z</span>
            <span>
              <strong id="userName">Zeora</strong>
              <small id="userUid">UID: 0000</small>
            </span>
          </div>

          <div class="permission-card" aria-label="应用权限">
            <p>此应用将获得以下权限</p>
            <ul>
              <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span>获取用户基本信息</span></li>
              <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span>发送站内通知</span></li>
              <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span>获取邮箱地址用于评论通知</span></li>
            </ul>
          </div>

          <button id="authorizeBtn" class="confirm-btn" type="button">确认登录</button>
        </section>

        <section id="returningView" class="state-view hidden">
          <h1>正在返回评论区</h1>
          <button id="retryReturnBtn" class="primary-btn" type="button">重试返回</button>
        </section>

        <p id="message" class="message" role="status"></p>
      </section>
    </main>

    <script src="/oauth/app.js?v=20260810-oauth4" defer></script>
  </body>
</html>
