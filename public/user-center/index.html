<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用户中心 - Zeora Blog</title>
    <link rel="stylesheet" href="/user-center/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section id="authView" class="auth-card hidden" aria-labelledby="authTitle">
        <header class="auth-head">
          <p class="auth-kicker">评论账号</p>
          <h1 id="authTitle" class="site-name">Zeora Blog 用户中心</h1>
          <p class="auth-lead">登录后可同步评论昵称、头像、个人主页和通知偏好。</p>
        </header>

        <div class="mode-tabs" role="tablist" aria-label="账号操作">
          <button type="button" data-auth-tab="login" class="is-active">登录</button>
          <button type="button" data-auth-tab="register">注册</button>
          <button type="button" data-auth-tab="reset">找回密码</button>
        </div>

        <div id="captchaStatus" class="security-pill hidden" aria-live="polite">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3 5.5 5.7v5.8c0 4 2.7 7.5 6.5 8.5 3.8-1 6.5-4.5 6.5-8.5V5.7L12 3Z" />
            <path d="m9.4 12.2 1.8 1.8 3.6-4" />
          </svg>
          <span>站点人机验证已启用</span>
        </div>

        <form id="authEmailForm" class="panel-form auth-step">
          <label class="field">
            <span>邮箱</span>
            <input id="authEmailInput" name="email" type="email" required autocomplete="email" placeholder="name@example.com" />
          </label>
          <label class="remember-row">
            <input id="rememberMeInput" name="rememberMe" type="checkbox" checked />
            <span>记住我，下次自动登录</span>
          </label>
          <button id="authNextBtn" class="primary-btn" type="submit">下一步</button>
        </form>

        <form id="authCodeForm" class="panel-form auth-step hidden">
          <label class="field">
            <span>邮箱验证码</span>
            <input name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" required autocomplete="one-time-code" placeholder="6 位验证码" />
          </label>
          <div class="form-actions">
            <button class="primary-btn" type="submit">确认登录</button>
            <button class="ghost-btn" type="button" data-back-email>上一步</button>
          </div>
        </form>

        <form id="authPasswordForm" class="panel-form auth-step hidden">
          <label class="field">
            <span>密码</span>
            <input name="password" type="password" required autocomplete="current-password" placeholder="输入你的密码" />
          </label>
          <div class="form-actions">
            <button class="primary-btn" type="submit">登录</button>
            <button class="ghost-btn" type="button" data-back-email>上一步</button>
          </div>
        </form>

        <form id="authRegisterForm" class="panel-form auth-step hidden">
          <label class="field">
            <span>邮箱验证码</span>
            <input name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" required autocomplete="one-time-code" placeholder="6 位验证码" />
          </label>
          <label class="field">
            <span>用户名</span>
            <input name="username" required minlength="3" maxlength="32" autocomplete="username" placeholder="new_user" />
          </label>
          <label class="field">
            <span>显示名称</span>
            <input name="displayName" maxlength="64" autocomplete="name" placeholder="你的昵称" />
          </label>
          <label class="field">
            <span>密码</span>
            <input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="至少 8 位" />
          </label>
          <div class="form-actions">
            <button class="primary-btn" type="submit">注册并进入</button>
            <button class="ghost-btn" type="button" data-back-email>上一步</button>
          </div>
        </form>

        <form id="authResetForm" class="panel-form auth-step hidden">
          <label class="field">
            <span>邮箱验证码</span>
            <input name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" required autocomplete="one-time-code" placeholder="6 位验证码" />
          </label>
          <label class="field">
            <span>新密码</span>
            <input name="newPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="至少 8 位" />
          </label>
          <div class="form-actions">
            <button class="primary-btn" type="submit">重置并进入</button>
            <button class="ghost-btn" type="button" data-back-email>上一步</button>
          </div>
        </form>

        <p class="auth-helper" id="authModeHint">登录会优先使用密码；注册和找回密码会发送邮箱验证码。</p>
        <p class="auth-switch hidden" id="authSwitchText">
          没有账号？<button id="authSwitchBtn" type="button" data-auth-mode="register">注册</button>
        </p>
      </section>

      <section id="publicProfileView" class="public-profile hidden" aria-label="用户主页"></section>

      <section id="centerView" class="user-center hidden" aria-label="用户中心">
        <aside class="center-sidebar">
          <a id="publicProfileLink" class="sidebar-profile" href="/user/zeora">
            <span id="profileAvatar" class="profile-avatar" aria-hidden="true">Z</span>
            <span class="sidebar-profile-copy">
              <strong id="profileName">zeora</strong>
              <small id="profileUid">@zeora</small>
            </span>
          </a>

          <div class="sidebar-meta">
            <span id="roleBadge" class="role-badge hidden">博主</span>
            <span id="profileJoined">加入于 2026年8月8日</span>
          </div>
          <p id="profileBio" class="bio-line">还没有填写个人简介</p>
          <p id="profileEmail" class="mail-line">name@example.com</p>

          <nav class="action-grid" aria-label="用户中心导航">
            <button class="action-card" type="button" data-route="/admin">
              <span class="action-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16"/><path d="M4 12h16"/><path d="M4 18.5h16"/><path d="M8 3.5v4"/><path d="M16 10v4"/><path d="M10 16.5v4"/></svg>
              </span>
              <span>概览</span>
            </button>
            <button class="action-card" type="button" data-route="/settings/profile">
              <span class="action-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4.5 20c.8-3.5 3.4-5.4 7.5-5.4s6.7 1.9 7.5 5.4"/></svg>
              </span>
              <span>个人资料</span>
            </button>
            <button class="action-card" type="button" data-route="/settings/password">
              <span class="action-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><path d="M6 11h12v9H6z"/><path d="M12 15v2"/></svg>
              </span>
              <span>安全中心</span>
            </button>
            <button class="action-card" type="button" data-route="/settings/notifications">
              <span class="action-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg>
              </span>
              <span>通知设置</span>
            </button>
            <button id="notificationLink" class="action-card" type="button" data-route="/notifications">
              <span class="action-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16v11H4z"/><path d="m4 7 8 6 8-6"/></svg>
              </span>
              <span>消息中心 <b id="notificationCount" class="notice-count hidden">0</b></span>
            </button>
            <button id="adminCard" class="action-card hidden" type="button" data-route="/admin/users">
              <span class="action-icon action-icon--admin">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.2 7 9.5 4-1.3 7-5 7-9.5V6l-7-3Z"/><path d="M9.5 12.5 11 14l3.8-4"/></svg>
              </span>
              <span>用户管理</span>
            </button>
          </nav>

          <button id="logoutBtn" class="logout-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H5v14h5"/><path d="M14 8l4 4-4 4"/><path d="M18 12H9"/></svg>
            <span>注销</span>
          </button>
        </aside>

        <section class="center-main">
          <a id="commentCenterReturn" class="center-return-link center-return-link--bar hidden" href="/admin" target="_self">返回用户中心</a>
          <section class="profile-hero">
            <p class="section-kicker">User Center</p>
            <h1 id="routeTitle">用户中心</h1>
            <p id="routeSubtitle">管理评论身份、公开资料和通知方式。</p>
          </section>
          <section id="routeView" class="route-view" aria-live="polite"></section>
        </section>
      </section>
    </main>

    <div id="modalRoot" class="modal-root hidden" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/user-center/app.js?v=20260810-center8" defer></script>
  </body>
</html>
